name: Build OpenWrt packages

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openwrt-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: OpenWrt IPK, apk and feeds
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: openwrt/opensocks/src/go.mod
          cache: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # meson, ninja, pkg-config and the OpenSSL/zlib headers build apk-tools.
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake git gzip tar \
            meson ninja-build pkg-config libssl-dev zlib1g-dev

      - name: Check architecture detection without od
        run: |
          # OpenWrt's stock BusyBox has CONFIG_OD unset, so "od" is absent on a
          # default install while hexdump is present. Run the detectors against a
          # real BusyBox built the same way: no od, hexdump available. This
          # guards the launcher and BOTH generated post-install scripts.
          set -eu
          sudo apt-get install -y --no-install-recommends busybox-static
          busybox --list | grep -qx hexdump || {
            echo 'busybox build lacks hexdump; the detectors depend on it' >&2
            exit 1
          }
          mkdir -p "${RUNNER_TEMP}/nood"
          # An empty directory placed first on PATH makes "od" unresolvable even
          # though the host has it, exactly like the router.
          PATH="${RUNNER_TEMP}/nood:${PATH}" busybox sh \
            openwrt/opensocks-minimal/tests/architecture_test.sh

      - name: Build pinned OpenWrt usign
        run: |
          git clone --no-checkout https://git.openwrt.org/project/usign.git "${RUNNER_TEMP}/usign"
          git -C "${RUNNER_TEMP}/usign" checkout c4c72b1b07945ee192361dc751291a7c98d6adcd
          cmake -S "${RUNNER_TEMP}/usign" -B "${RUNNER_TEMP}/usign/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "${RUNNER_TEMP}/usign/build" --parallel

      - name: Build pinned apk-tools
        env:
          APK_TOOLS_DIR: ${{ runner.temp }}/apk-tools-bin
        run: |
          # apk-tools 3.0.5 at the commit openwrt/openwrt openwrt-25.12 pins.
          # The script pins that commit itself; APK_TOOLS_DIR is only where the
          # binary is installed. It also checks mkpkg/mkndx/adbsign and
          # round-trips a throwaway package, so a broken OpenSSL/zlib link fails
          # here instead of during the release build.
          ./tools/build-apk-tool.sh "$APK_TOOLS_DIR"
          "$APK_TOOLS_DIR/apk" --version

      - name: Build OpenWrt packages
        env:
          OPKG_SIGNING_KEY: ${{ secrets.OPKG_SIGNING_KEY }}
          # EC P-256 key pair for apk v3 signing. It signs the packages (mkpkg)
          # and the index, which is the only form apk-tools 3 accepts, so both
          # secrets are REQUIRED: the build step stops with a clear message when
          # either is missing rather than publishing a feed nobody can install.
          APK_SIGNING_KEY_PEM: ${{ secrets.APK_SIGNING_KEY_PEM }}
          APK_PUBLIC_KEY_PEM: ${{ secrets.APK_PUBLIC_KEY_PEM }}
          BUILD_APK: "1"
          APK_BIN: ${{ runner.temp }}/apk-tools-bin/apk
          OPENWRT_ONLY: "1"
          RELEASE_DIR: ${{ runner.temp }}/opensocks-release
        run: |
          set -eu
          VERSION="$(sed -n 's/^PKG_VERSION:=//p' openwrt/opensocks/Makefile)"
          RELEASE="$(sed -n 's/^PKG_RELEASE:=//p' openwrt/opensocks/Makefile)"
          test -n "$VERSION" && test -n "$RELEASE"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "$GITHUB_REF_NAME" = "v$VERSION"
          fi
          for makefile in openwrt/opensocks-minimal/Makefile openwrt/luci-app-opensocks/Makefile; do
            test "$(sed -n 's/^PKG_VERSION:=//p' "$makefile")" = "$VERSION"
            test "$(sed -n 's/^PKG_RELEASE:=//p' "$makefile")" = "$RELEASE"
          done

          umask 077

          # The apk feed is the one this repository actually publishes, and it
          # MUST be signed: apk-tools 3 cannot even index an unsigned package
          # (mkpkg writes the signature, mkndx verifies it). Use the repo's own
          # EC P-256 key, which is unrelated to any upstream key and is trusted
          # through keys/opensocks-apk.pem.
          if [ -n "${APK_SIGNING_KEY_PEM}" ] && [ -n "${APK_PUBLIC_KEY_PEM}" ]; then
            printf '%s\n' "$APK_SIGNING_KEY_PEM" > "${RUNNER_TEMP}/opensocks-apk.sec"
            printf '%s\n' "$APK_PUBLIC_KEY_PEM" > "${RUNNER_TEMP}/opensocks-apk.pub"
            echo 'using the configured apk signing key'
          else
            # Leave the key files absent so build-apk-repo.sh stops with its own
            # clear message instead of publishing something uninstallable.
            echo 'APK_SIGNING_KEY_PEM secret is required: apk cannot index unsigned packages' >&2
            exit 1
          fi
          export APK_SIGNING_KEY_FILE="${RUNNER_TEMP}/opensocks-apk.sec"
          export APK_PUBLIC_KEY_FILE="${RUNNER_TEMP}/opensocks-apk.pub"

          # The opkg/IPK feed is built for 22.03-24.10 users but is not this
          # repository's publishing target, so it is signed only when a usign
          # key happens to be configured and is otherwise left unsigned.
          if [ -n "$OPKG_SIGNING_KEY" ]; then
            printf '%s\n' "$OPKG_SIGNING_KEY" > "${RUNNER_TEMP}/opensocks-usign.sec"
            export OPKG_SIGNING_KEY_FILE="${RUNNER_TEMP}/opensocks-usign.sec"
            export OPKG_PUBLIC_KEY_FILE="$GITHUB_WORKSPACE/keys/d24a5e234001294c"
            export REQUIRE_SIGNATURE=1
            echo 'using the configured opkg signing key'
          else
            export REQUIRE_SIGNATURE=0
            echo 'OPKG_SIGNING_KEY not set: building an UNSIGNED opkg feed' >&2
          fi

          export OPENWRT_ONLY=1
          export BUILD_APK=1
          export RELEASE_DIR VERSION RELEASE
          export USIGN="${RUNNER_TEMP}/usign/build/usign"
          ./tools/build-release.sh

      - name: Verify opkg feed
        env:
          RELEASE_DIR: ${{ runner.temp }}/opensocks-release
          # Signing the opkg feed is optional: this repository publishes the apk
          # feed, and the IPK output exists for 22.03-24.10 users who want it.
          HAVE_OPKG_KEY: ${{ secrets.OPKG_SIGNING_KEY != '' && '1' || '0' }}
        run: |
          set -eu
          test -s "$RELEASE_DIR/Packages"
          test -s "$RELEASE_DIR/Packages.gz"
          if [ "$HAVE_OPKG_KEY" != "1" ]; then
            echo 'opkg feed is UNSIGNED (no OPKG_SIGNING_KEY secret; not this repo'"'"'s publish target)' >&2
          fi
          ipk_count="$(find "$RELEASE_DIR" -maxdepth 1 -name '*.ipk' | wc -l | tr -d ' ')"
          # multi-arch: luci + minimal + at least mipsel and one aarch64 opensocks package
          test "$ipk_count" -ge 4
          test -s "$RELEASE_DIR/opensocks-linux-mipsle.gz"
          test -s "$RELEASE_DIR/opensocks-linux-arm64.gz"
          test -n "$(find "$RELEASE_DIR" -maxdepth 1 -name 'opensocks_*_mipsel_24kc.ipk')"
          test -n "$(find "$RELEASE_DIR" -maxdepth 1 -name 'opensocks_*_aarch64_cortex-a53*.ipk')"
          grep -q 'X-OpenSocks-Binary-SHA256-arm64:' "$RELEASE_DIR/Packages"
          grep -q 'X-OpenSocks-Binary-URL-arm64:' "$RELEASE_DIR/Packages"
          # The packages must no longer pull in the removed proxy engines.
          if grep -q 'shadowsocks-libev\|ss-redir\|ss-local\|mihomo\|sing-box\|redsocks' "$RELEASE_DIR/Packages"; then
            echo 'opkg Packages still reference a removed proxy engine' >&2
            exit 1
          fi
          gzip -t "$RELEASE_DIR/Packages.gz"
          (cd "$RELEASE_DIR" && shasum -a 256 -c SHA256SUMS)
          if [ "$HAVE_OPKG_KEY" = "1" ]; then
            "${RUNNER_TEMP}/usign/build/usign" -V -m "$RELEASE_DIR/Packages" -p "$GITHUB_WORKSPACE/keys/d24a5e234001294c" -x "$RELEASE_DIR/Packages.sig"
            "${RUNNER_TEMP}/usign/build/usign" -V -m "$RELEASE_DIR/SHA256SUMS" -p "$GITHUB_WORKSPACE/keys/d24a5e234001294c" -x "$RELEASE_DIR/SHA256SUMS.sig"
          fi

      - name: Verify apk feed
        env:
          RELEASE_DIR: ${{ runner.temp }}/opensocks-release
          APK_BIN: ${{ runner.temp }}/apk-tools-bin/apk
          HAVE_APK_KEY: ${{ secrets.APK_SIGNING_KEY_PEM != '' && '1' || '0' }}
        run: |
          set -eu
          # This is the feed the repository publishes, signed with its own EC
          # P-256 key (keys/opensocks-apk.pem is the trusted public half).
          test "$HAVE_APK_KEY" = "1" || {
            echo 'APK_SIGNING_KEY_PEM secret is missing; the apk feed is required' >&2
            exit 1
          }
          test -s "$RELEASE_DIR/repo/packages.adb"
          test -s "$RELEASE_DIR/repo/packages.adb.gz"
          apk_count="$(find "$RELEASE_DIR/repo" -maxdepth 1 -name '*.apk' | wc -l | tr -d ' ')"
          test "$apk_count" -ge 3
          test -n "$(find "$RELEASE_DIR/repo" -maxdepth 1 -name 'opensocks-*-mipsel_24kc.apk')"
          test -n "$(find "$RELEASE_DIR/repo" -maxdepth 1 -name 'opensocks-*-aarch64_cortex-a53.apk')"
          test -n "$(find "$RELEASE_DIR/repo" -maxdepth 1 -name 'opensocks-minimal-*-noarch.apk')"
          test -n "$(find "$RELEASE_DIR/repo" -maxdepth 1 -name 'luci-app-opensocks-*-noarch.apk')"
          # Vendor-only opkg arch aliases must not leak into the apk feed.
          if find "$RELEASE_DIR/repo" -maxdepth 1 -name '*_neon-vfpv4.apk' | grep -q .; then
            echo 'apk feed contains an opkg-only vendor arch alias' >&2
            exit 1
          fi
          # verify resolves signatures against trust->trusted_key_list, which apk
          # populates only from --keys-dir (or etc/apk/keys), so point it at the
          # published public key.
          test -s "$RELEASE_DIR/repo/opensocks.pem"
          # The published public key must be the repository's documented trust
          # anchor. Without this check a fork that set APK_SIGNING_KEY_PEM but
          # forgot to update keys/opensocks-apk.pem would publish a feed whose
          # key does not match the one the README tells clients to install.
          #
          # Compare the key MATERIAL, not the bytes: the secret arrives without
          # its trailing newline and may carry CRLF from a Windows editor, so a
          # plain cmp would fail on line endings alone.
          key_material() { tr -d '[:space:]' < "$1"; }
          if [ "$(key_material "$RELEASE_DIR/repo/opensocks.pem")" != \
               "$(key_material "$GITHUB_WORKSPACE/keys/opensocks-apk.pem")" ]; then
            echo 'published opensocks.pem does not match keys/opensocks-apk.pem' >&2
            echo 'the APK_SIGNING_KEY_PEM secret and the committed public key disagree' >&2
            exit 1
          fi
          keys_dir="${RUNNER_TEMP}/apk-trust"
          rm -rf "$keys_dir"
          mkdir -p "$keys_dir"
          cp "$RELEASE_DIR/repo/opensocks.pem" "$keys_dir/opensocks.pem"
          "$APK_BIN" --keys-dir "$keys_dir" verify "$RELEASE_DIR/repo/packages.adb"
          for apk in "$RELEASE_DIR/repo"/*.apk; do
            "$APK_BIN" --keys-dir "$keys_dir" verify "$apk"
          done
          echo 'apk feed is signed with the configured key'

      - name: Upload OpenWrt artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: opensocks-openwrt-${{ github.sha }}
          path: ${{ runner.temp }}/opensocks-release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ runner.temp }}/opensocks-release
        run: |
          set -eu
          case "$GITHUB_REF_NAME" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "Invalid release tag: $GITHUB_REF_NAME" >&2; exit 1;; esac
          ./tools/release-notes.sh "$GITHUB_REF_NAME" > "${RUNNER_TEMP}/release-notes.md"
          test -s "${RUNNER_TEMP}/release-notes.md"

          # "$RELEASE_DIR"/* only expands to top-level files, which would leave
          # the whole apk feed (repo/) unpublished. Collect the flat opkg assets
          # and the apk feed contents into one staging dir, then upload that.
          # The apk feed is a flat directory by design (see PKGNAME_SPEC in
          # tools/build-apk-repo.sh), so dropping it into the release root keeps
          # packages.adb resolving the .apk files next to it.
          assets="${RUNNER_TEMP}/release-assets"
          rm -rf "$assets"
          mkdir -p "$assets"
          find "$RELEASE_DIR" -maxdepth 1 -type f -exec cp {} "$assets/" \;
          if [ -d "$RELEASE_DIR/repo" ]; then
            # repo/ carries its own SHA256SUMS, which would clobber the opkg one
            # because release assets are flat. The apk index authenticates every
            # package by hash inside the ADB itself, so rename the apk manifest
            # instead of dropping it.
            find "$RELEASE_DIR/repo" -maxdepth 1 -type f ! -name SHA256SUMS \
              -exec cp {} "$assets/" \;
            if [ -f "$RELEASE_DIR/repo/SHA256SUMS" ]; then
              cp "$RELEASE_DIR/repo/SHA256SUMS" "$assets/apk-SHA256SUMS"
            fi
          fi
          # The apk feed is always part of a release now, so a missing index here
          # means the build step did not do its job.
          test -s "$assets/packages.adb" || {
            echo 'apk feed is missing from the release assets' >&2
            exit 1
          }
          echo "apk feed included: $(find "$assets" -maxdepth 1 -name '*.apk' | wc -l | tr -d ' ') package(s)"
          gh release create "$GITHUB_REF_NAME" "$assets"/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "OpenSocks ${GITHUB_REF_NAME#v}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
